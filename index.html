<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Orientation — Premium Reality</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-color: #fcfcfc;
            --face-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #ff3b30;
            --clock-size: 75vmin;
            --label-size: 8vmin;
            --reality-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Premium Milled Metal Bezel */
        #clock-bezel {
            width: var(--clock-size);
            height: var(--clock-size);
            border: 0.2vmin solid #b5b5b5;
            /* Significantly sharper, solid metallic outline */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            background: linear-gradient(135deg, #d8d8d8 0%, #f4f4f4 50%, #b0b0b0 100%);
            /* High contrast against the #fcfcfc white background */
            /* Creates the physical structural thickness of the ring */
            padding: 2.5vmin;
            /* Internal machining highlights and chamfers (no outer page bleed) */
            box-shadow:
                inset 0.3vmin 0.3vmin 0.8vmin rgba(255, 255, 255, 1),
                inset -0.4vmin -0.4vmin 1.5vmin rgba(0, 0, 0, 0.15),
                inset 1vmin 1vmin 3vmin rgba(255, 255, 255, 0.4);
            transform: translateZ(0);
        }

        /* Recessed Dial with Domed Glass Illusion */
        #clock-face {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f4f4f4 100%);
            /* Bezel lip shadow casting downwards, plus extreme concavity depth */
            box-shadow:
                0.3vmin 0.5vmin 1.5vmin rgba(0, 0, 0, 0.1),
                /* Rim casting shadow onto dial edge */
                inset 2vmin 2vmin 5vmin rgba(0, 0, 0, 0.06),
                /* Sunken darkness */
                inset -1vmin -1vmin 3vmin rgba(255, 255, 255, 1);
            /* Bottom highlight catching light */
        }

        /* Viscous Trail Elements */
        .trail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            width: 20vmin;
            height: 10vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: transform 5s var(--reality-ease), opacity 1s ease;
            filter: blur(1px);
        }

        /* Staggered lag for trails */
        .trail-1 {
            transition-duration: 5.8s;
        }

        .trail-2 {
            transition-duration: 6.5s;
        }

        /* Only show trails during the active drift */
        .is-drifting .trail {
            opacity: 0.15;
            transition: transform 5s var(--reality-ease), opacity 0.5s ease;
        }

        .is-drifting .trail-1 {
            transition-duration: 5.8s;
        }

        .is-drifting .trail-2 {
            transition-duration: 6.5s;
        }

        /* Ensure trial font matches labels */
        .h-trail {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
        }

        .m-trail {
            font-weight: 200;
        }

        /* Labels (Modernized Typography) */
        .label {
            position: absolute;
            top: 50%;
            left: 50%;
            transition: transform 5.0s var(--reality-ease);
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 20vmin;
            height: 12vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
            transform: translate(-50%, -50%);
        }

        .hour-label {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
            /* Make it float noticeably higher */
            filter: drop-shadow(-1vmin 1.5vmin 1.5vmin rgba(0, 0, 0, 0.12));
            z-index: 12;
        }

        .minute-label {
            font-weight: 200;
            opacity: 0.6;
            /* Recess it down near the glass surface */
            filter: drop-shadow(-0.2vmin 0.4vmin 0.5vmin rgba(0, 0, 0, 0.04));
            z-index: 11;
        }

        /* Premium Solid Hands */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            background: var(--text-color);
            border-radius: 10vmin;
            z-index: 100;
            box-shadow:
                -1vmin 1vmin 1.5vmin rgba(0, 0, 0, 0.1),
                0 0 0.2vmin rgba(0, 0, 0, 0.2);
        }

        .hand.hour {
            width: 1.1vmin;
            height: 21vmin;
            z-index: 101;
        }

        .hand.minute {
            width: 0.8vmin;
            height: 34vmin;
            opacity: 0.9;
            z-index: 100;
        }

        .hand.second {
            width: 0.4vmin;
            height: 34vmin;
            background: var(--accent-color);
            z-index: 150;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            box-shadow:
                0 0 0.2vmin rgba(255, 59, 48, 0.6),
                /* Tight laser core */
                0 0 0.8vmin rgba(255, 59, 48, 0.15);
            /* Subtle natural glow */
        }

        /* Multi-tier Engineering Center Pin */
        #clock-bezel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.6vmin;
            height: 2.6vmin;
            background: linear-gradient(145deg, #ffffff, #d9d9d9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1999;
            box-shadow:
                -0.5vmin 0.5vmin 1vmin rgba(0, 0, 0, 0.15),
                inset 0.2vmin 0.2vmin 0.5vmin rgba(255, 255, 255, 0.8);
        }

        #clock-bezel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.8vmin;
            height: 0.8vmin;
            background: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2001;
            box-shadow:
                -0.2vmin 0.2vmin 0.5vmin rgba(0, 0, 0, 0.2),
                inset 0.1vmin 0.1vmin 0.2vmin rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <div id="clock-bezel">
        <div id="clock-face">
            <!-- Viscous Trails -->
            <div id="h-trail-2" class="trail h-trail trail-2"></div>
            <div id="h-trail-1" class="trail h-trail trail-1"></div>
            <div id="m-trail-2" class="trail m-trail trail-2"></div>
            <div id="m-trail-1" class="trail m-trail trail-1"></div>

            <!-- Main Labels -->
            <div id="h-label" class="label hour-label"></div>
            <div id="m-label" class="label minute-label"></div>

            <div class="hand hour"></div>
            <div class="hand minute"></div>
            <div class="hand second"></div>
        </div>
    </div>

    <script>
        let lastMilestone = -1;
        let lastSecond = -1;
        let rotS = 0;

        let hTargetX = 0, hTargetY = 0;
        let mTargetX = 0, mTargetY = 0;

        const RADIUS = 28.5; // Adjusted to a middle ground for better spacing

        function getSafeXY(fixedX, fixedY) {
            let angle = Math.random() * Math.PI * 2;
            let x = Math.cos(angle) * RADIUS;
            let y = Math.sin(angle) * RADIUS;
            const dist = Math.sqrt((x - fixedX) ** 2 + (y - fixedY) ** 2);
            if (dist < 23) return getSafeXY(fixedX, fixedY);
            return { x, y };
        }

        function shiftReality() {
            const hAngle = Math.random() * Math.PI * 2;
            hTargetX = Math.cos(hAngle) * RADIUS;
            hTargetY = Math.sin(hAngle) * RADIUS;

            const mPos = getSafeXY(hTargetX, hTargetY);
            mTargetX = mPos.x;
            mTargetY = mPos.y;

            // Trigger "Drifting" state
            const bezel = document.getElementById('clock-bezel');
            bezel.classList.add('is-drifting');

            // Apply linear drift to main labels and their trails
            const targets = [
                'h-label', 'h-trail-1', 'h-trail-2',
                'm-label', 'm-trail-1', 'm-trail-2'
            ];

            targets.forEach(id => {
                const isH = id.startsWith('h');
                const tx = isH ? hTargetX : mTargetX;
                const ty = isH ? hTargetY : mTargetY;
                document.getElementById(id).style.transform = `translate3d(calc(-50% + ${tx}vmin), calc(-50% + ${ty}vmin), 0)`;
            });

            // Return to "Resting State" after transit (5 seconds)
            setTimeout(() => {
                bezel.classList.remove('is-drifting');
            }, 5000);

            setTimeout(shiftReality, 7000 + Math.random() * 8000); // Slightly longer gap to allow resting
        }

        function update() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            const displayH = h % 12 || 12;
            const mMilestone = Math.floor((m - 3 < 0 ? 0 : m - 3) / 5) * 5;

            const hLabelEl = document.getElementById('h-label');
            const mLabelEl = document.getElementById('m-label');

            // Sync trail text with main labels
            const trailsH = document.querySelectorAll('.h-trail');
            const trailsM = document.querySelectorAll('.m-trail');

            hLabelEl.textContent = displayH;
            trailsH.forEach(t => t.textContent = displayH);

            if (mMilestone !== lastMilestone) {
                lastMilestone = mMilestone;
                mLabelEl.textContent = String(lastMilestone).padStart(2, '0');
                trailsM.forEach(t => t.textContent = String(lastMilestone).padStart(2, '0'));
            }

            // Use target coordinates directly to calculate the true final angle the hands are seeking
            const finalBaseHAngle = Math.atan2(hTargetY, hTargetX) * 180 / Math.PI + 90;
            const finalBaseMAngle = Math.atan2(mTargetY, mTargetX) * 180 / Math.PI + 90;

            const hOffset = (m / 60) * 30 + (s / 3600) * 30;
            const mOffset = (m - lastMilestone) * 6 + (s / 60) * 6;

            let targetH = finalBaseHAngle + hOffset;
            let targetM = finalBaseMAngle + mOffset;

            // Initialize global hand rotations if they don't exist
            if (window.rotH === undefined) {
                window.rotH = targetH;
                window.rotM = targetM;
            } else {
                // Determine shortest positive (clockwise) distance to target
                let diffH = (targetH - window.rotH) % 360;
                if (diffH < 0) diffH += 360;

                let diffM = (targetM - window.rotM) % 360;
                if (diffM < 0) diffM += 360;

                // Protect against tiny backwards floating point jitter (preventing full 360 resets)
                if (diffH > 359.5) diffH = 0;
                if (diffM > 359.5) diffM = 0;

                // Smoothly sweep clockwise towards the destination (reduced speed by 50%)
                window.rotH += diffH * 0.02;
                window.rotM += diffM * 0.02;
            }

            document.querySelector('.hand.hour').style.transform = `translateX(-50%) rotate(${window.rotH}deg)`;
            document.querySelector('.hand.minute').style.transform = `translateX(-50%) rotate(${window.rotM}deg)`;

            if (s !== lastSecond) {
                const diff = (s - lastSecond + 60) % 60;
                rotS += diff * 6;
                lastSecond = s;
                document.querySelector('.hand.second').style.transform = `translateX(-50%) rotate(${rotS}deg)`;
            }

            requestAnimationFrame(update);
        }

        shiftReality();
        update();
    </script>
</body>

</html>
