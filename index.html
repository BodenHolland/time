<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Orientation — Premium Reality</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-color: #fcfcfc;
            --face-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #ff3b30;
            --clock-size: 85vmin;
            --label-size: 11vmin;
            --reality-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Premium Multi-layered Bezel */
        #clock-bezel {
            width: var(--clock-size);
            height: var(--clock-size);
            border: 0.3vmin solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            background: var(--face-color);
            /* Internal Depth Only */
            box-shadow: inset 0 0 4vmin rgba(0, 0, 0, 0.02);
            transform: translateZ(0);
        }

        /* Lens Effect Gradient */
        #clock-face {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #f9f9f9 100%);
        }

        /* Viscous Trail Elements */
        .trail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            width: 20vmin;
            height: 10vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: transform 5s var(--reality-ease), opacity 1s ease;
            filter: blur(1px);
        }

        /* Staggered lag for trails */
        .trail-1 {
            transition-duration: 5.8s;
        }

        .trail-2 {
            transition-duration: 6.5s;
        }

        /* Only show trails during the active drift */
        .is-drifting .trail {
            opacity: 0.15;
            transition: transform 5s var(--reality-ease), opacity 0.5s ease;
        }

        .is-drifting .trail-1 {
            transition-duration: 5.8s;
        }

        .is-drifting .trail-2 {
            transition-duration: 6.5s;
        }

        /* Ensure trial font matches labels */
        .h-trail {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
        }

        .m-trail {
            font-weight: 200;
        }

        /* Labels (Modernized Typography) */
        .label {
            position: absolute;
            top: 50%;
            left: 50%;
            transition: transform 5.0s var(--reality-ease);
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 20vmin;
            height: 12vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
            filter: drop-shadow(0 0.5vmin 1vmin rgba(0, 0, 0, 0.03));
            transform: translate(-50%, -50%);
        }

        .hour-label {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
        }

        .minute-label {
            font-weight: 200;
            opacity: 0.6;
        }

        /* Premium Solid Hands */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            background: var(--text-color);
            border-radius: 10vmin;
            z-index: 100;
            box-shadow: 0 1vmin 2vmin rgba(0, 0, 0, 0.04);
        }

        .hand.hour {
            width: 1.1vmin;
            height: 26vmin;
            z-index: 101;
        }

        .hand.minute {
            width: 0.8vmin;
            height: 38vmin;
            opacity: 0.9;
            z-index: 100;
        }

        .hand.second {
            width: 0.4vmin;
            height: 34vmin;
            background: var(--accent-color);
            z-index: 150;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            box-shadow:
                0 0 0.5vmin rgba(255, 59, 48, 0.8),
                /* Tight laser core */
                0 0 2vmin rgba(255, 59, 48, 0.4),
                /* Medium bloom */
                0 0 5vmin rgba(255, 59, 48, 0.1);
            /* Wide atmospheric glow */
        }

        /* Multi-tier Engineering Center Pin */
        #clock-bezel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.6vmin;
            height: 2.6vmin;
            background: var(--face-color);
            border: 0.5vmin solid var(--text-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1999;
            box-shadow: inset 0 0.2vmin 0.5vmin rgba(0, 0, 0, 0.05);
        }

        #clock-bezel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.8vmin;
            height: 0.8vmin;
            background: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2001;
            box-shadow: 0 0.2vmin 0.5vmin rgba(255, 59, 48, 0.3);
        }
    </style>
</head>

<body>

    <div id="clock-bezel">
        <div id="clock-face">
            <!-- Viscous Trails -->
            <div id="h-trail-2" class="trail h-trail trail-2"></div>
            <div id="h-trail-1" class="trail h-trail trail-1"></div>
            <div id="m-trail-2" class="trail m-trail trail-2"></div>
            <div id="m-trail-1" class="trail m-trail trail-1"></div>

            <!-- Main Labels -->
            <div id="h-label" class="label hour-label"></div>
            <div id="m-label" class="label minute-label"></div>

            <div class="hand hour"></div>
            <div class="hand minute"></div>
            <div class="hand second"></div>
        </div>
    </div>

    <script>
        let lastMilestone = -1;
        let lastSecond = -1;
        let rotS = 0;

        let hTargetX = 0, hTargetY = 0;
        let mTargetX = 0, mTargetY = 0;

        const RADIUS = 32;

        function getSafeXY(fixedX, fixedY) {
            let angle = Math.random() * Math.PI * 2;
            let x = Math.cos(angle) * RADIUS;
            let y = Math.sin(angle) * RADIUS;
            const dist = Math.sqrt((x - fixedX) ** 2 + (y - fixedY) ** 2);
            if (dist < 30) return getSafeXY(fixedX, fixedY);
            return { x, y };
        }

        function shiftReality() {
            const hAngle = Math.random() * Math.PI * 2;
            hTargetX = Math.cos(hAngle) * RADIUS;
            hTargetY = Math.sin(hAngle) * RADIUS;

            const mPos = getSafeXY(hTargetX, hTargetY);
            mTargetX = mPos.x;
            mTargetY = mPos.y;

            // Trigger "Drifting" state
            const bezel = document.getElementById('clock-bezel');
            bezel.classList.add('is-drifting');

            // Apply linear drift to main labels and their trails
            const targets = [
                'h-label', 'h-trail-1', 'h-trail-2',
                'm-label', 'm-trail-1', 'm-trail-2'
            ];

            targets.forEach(id => {
                const isH = id.startsWith('h');
                const tx = isH ? hTargetX : mTargetX;
                const ty = isH ? hTargetY : mTargetY;
                document.getElementById(id).style.transform = `translate3d(calc(-50% + ${tx}vmin), calc(-50% + ${ty}vmin), 0)`;
            });

            // Return to "Resting State" after transit (5 seconds)
            setTimeout(() => {
                bezel.classList.remove('is-drifting');
            }, 5000);

            setTimeout(shiftReality, 7000 + Math.random() * 8000); // Slightly longer gap to allow resting
        }

        function update() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            const displayH = h % 12 || 12;
            const mMilestone = Math.floor((m - 3 < 0 ? 0 : m - 3) / 5) * 5;

            const hLabelEl = document.getElementById('h-label');
            const mLabelEl = document.getElementById('m-label');

            // Sync trail text with main labels
            const trailsH = document.querySelectorAll('.h-trail');
            const trailsM = document.querySelectorAll('.m-trail');

            hLabelEl.textContent = displayH;
            trailsH.forEach(t => t.textContent = displayH);

            if (mMilestone !== lastMilestone) {
                lastMilestone = mMilestone;
                mLabelEl.textContent = String(lastMilestone).padStart(2, '0');
                trailsM.forEach(t => t.textContent = String(lastMilestone).padStart(2, '0'));
            }

            const rectH = hLabelEl.getBoundingClientRect();
            const rectM = mLabelEl.getBoundingClientRect();
            const rectC = document.getElementById('clock-bezel').getBoundingClientRect();

            const centerX = rectC.left + rectC.width / 2;
            const centerY = rectC.top + rectC.height / 2;

            const baseHAngle = Math.atan2((rectH.top + rectH.height / 2) - centerY, (rectH.left + rectH.width / 2) - centerX) * 180 / Math.PI + 90;
            const baseMAngle = Math.atan2((rectM.top + rectM.height / 2) - centerY, (rectM.left + rectM.width / 2) - centerX) * 180 / Math.PI + 90;

            const hOffset = (m / 60) * 30 + (s / 3600) * 30;
            const mOffset = (m - lastMilestone) * 6 + (s / 60) * 6;

            document.querySelector('.hand.hour').style.transform = `translateX(-50%) rotate(${baseHAngle + hOffset}deg)`;
            document.querySelector('.hand.minute').style.transform = `translateX(-50%) rotate(${baseMAngle + mOffset}deg)`;

            if (s !== lastSecond) {
                const diff = (s - lastSecond + 60) % 60;
                rotS += diff * 6;
                lastSecond = s;
                document.querySelector('.hand.second').style.transform = `translateX(-50%) rotate(${rotS}deg)`;
            }

            requestAnimationFrame(update);
        }

        shiftReality();
        update();
    </script>
</body>

</html>
