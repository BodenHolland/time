<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Orientation — Aurora</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            /* Restoring base clock-size to 75vmin to keep internal JS radius ratios correct */
            --clock-size: 75vmin;
            --label-size: 8vmin;
            --reality-ease: cubic-bezier(0.16, 1, 0.3, 1);

            /* Dynamic Time Colors — driven by JS */
            --face-center: #1a1a24;
            --face-edge: #050508;

            /* Glow colors — driven by JS from palette text colors */
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Separate container to cast the drop shadow without being clipped by the WebKit backdrop-filter bug */
        #clock-shadow {
            position: absolute;
            width: var(--clock-size);
            height: var(--clock-size);
            border-radius: 50%;
            box-shadow:
                /* Guaranteed neutral umbra — always visible against white page */
                0 4vmin 10vmin rgba(0, 0, 0, 0.18),
                0 1.5vmin 4vmin rgba(0, 0, 0, 0.10),
                /* Accent-tinted layer on top for color anticipation */
                0 3vmin 8vmin color-mix(in srgb, var(--next-accent, rgba(0, 0, 0, 1)) 12%, transparent),
                0 1vmin 3vmin color-mix(in srgb, var(--next-accent, rgba(0, 0, 0, 1)) 5%, transparent);
            transform: scale(1) translateZ(0);
            transition: box-shadow 1s linear;
        }

        /* iOS Vibrant Liquid Glass Bezel with Color Anticipation */
        #clock-bezel {
            width: var(--clock-size);
            height: var(--clock-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            padding: 1.5vmin;

            /* High blur, high saturation "iOS vibrant" glass infused with the upcoming color shift */
            /* We use the --next-accent (text color) since it ensures pigment even when the clock face is white */
            background: color-mix(in srgb, var(--next-accent, rgba(255, 255, 255, 1)) 15%, rgba(255, 255, 255, 0.25));
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);

            box-shadow:
                /* Sharp bright rim specular reflection */
                inset 0.2vmin 0.2vmin 0.6vmin rgba(255, 255, 255, 0.8),
                /* Soft volumetric bounce light inside the thick glass */
                inset 1vmin 1vmin 3vmin color-mix(in srgb, var(--next-accent, rgba(255, 255, 255, 1)) 20%, rgba(255, 255, 255, 0.3)),
                /* Inner sharp edge detail */
                inset -0.1vmin -0.1vmin 0.3vmin rgba(255, 255, 255, 0.6),
                /* Dark index of refraction rim */
                inset -0.4vmin -0.4vmin 1.5vmin rgba(0, 0, 0, 0.1);

            /* Crisp outer border — always slightly dark so it never bleaches against white page */
            border: 0.15vmin solid color-mix(in srgb, var(--next-accent, rgba(0, 0, 0, 1)) 20%, rgba(0, 0, 0, 0.20));

            /* Reverting scale to 1 to allow the clock to take up exactly 75% of the viewport 
               (as dictated by the base --clock-size of 75vmin), retaining the soft shadow. */
            transform: scale(1) translateZ(0);
            transition: background 1s linear, border 1s linear, box-shadow 1s linear;
        }

        /* Color-shifting radial face — from design 3 */
        #clock-face {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--face-center) 0%, var(--face-edge) 100%);
            box-shadow:
                inset 0 0 4vmin rgba(255, 255, 255, 0.06),
                inset 2vmin 2vmin 5vmin rgba(0, 0, 0, 0.2);
            transition: background 1s linear;
            overflow: hidden;
        }

        /* Iridescent interference shimmer — from design 4 */
        #clock-face::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 180deg at 40% 60%,
                    rgba(255, 100, 150, 0.05),
                    rgba(80, 200, 255, 0.05),
                    rgba(150, 255, 180, 0.03),
                    rgba(255, 220, 80, 0.04),
                    rgba(180, 80, 255, 0.05),
                    rgba(255, 100, 150, 0.05));
            animation: shimmer-drift 12s ease-in-out infinite alternate;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes shimmer-drift {
            from {
                transform: rotate(0deg) scale(1);
                opacity: 0.5;
            }

            to {
                transform: rotate(60deg) scale(1.05);
                opacity: 1;
            }
        }

        /* Viscous Trail Elements */
        .trail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--label-size);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            width: 20vmin;
            height: 10vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 3s ease;
            filter: blur(1.5px);
        }

        .is-h-drifting .h-trail,
        .is-m-drifting .m-trail {
            opacity: 0.18;
            transition: opacity 0.5s ease;
        }

        /* Trails — color and text-shadow applied dynamically by JS */
        .h-trail {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
        }

        .m-trail {
            font-weight: 200;
        }

        /* Labels with holographic chromatic aberration — from design 4 */
        .label {
            position: absolute;
            top: 50%;
            left: 50%;
            transition: opacity 3s ease, filter 3s ease;
            font-size: var(--label-size);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 20vmin;
            height: 12vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
            transform: translate(-50%, -50%);
        }

        .hour-label {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
            z-index: 12;
            /* color and text-shadow applied dynamically by JS */
        }

        .minute-label {
            font-weight: 200;
            z-index: 11;
            opacity: 0.9;
            /* color and text-shadow applied dynamically by JS */
        }

        /* Ghosting Effect during Drift */
        .is-h-drifting .hour-label,
        .is-m-drifting .minute-label {
            opacity: 0.03;
            filter: blur(4px);
            transition: opacity 2s ease, filter 2s ease;
        }

        .is-h-drifting .hand.hour,
        .is-m-drifting .hand.minute {
            opacity: 0.03;
            filter: blur(3px);
            transition: opacity 2s ease, filter 2s ease;
        }

        /* Laser beam hands — from design 4, colors adapt to time of day */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            border-radius: 10vmin;
            z-index: 100;
            transition: opacity 3s ease, filter 3s ease;
        }

        .hand.hour {
            width: 0.5vmin;
            height: 21vmin;
            /* background and box-shadow applied dynamically by JS */
            z-index: 101;
        }

        .hand.minute {
            width: 0.35vmin;
            height: 34vmin;
            /* background and box-shadow applied dynamically by JS */
            opacity: 0.9;
            z-index: 100;
        }

        .hand.second {
            width: 0.2vmin;
            height: 34.8vmin;
            background: linear-gradient(to top,
                    rgba(255, 80, 120, 0) 0%,
                    rgba(255, 80, 120, 0.7) 30%,
                    rgba(255, 160, 180, 1) 100%);
            z-index: 150;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            box-shadow:
                0 0 0.4vmin rgba(255, 100, 140, 0.9),
                0 0 1.5vmin rgba(255, 60, 100, 0.5),
                0 0 4vmin rgba(255, 40, 80, 0.2);
        }

        /* Glass center pin — mirrors the face color, lighter and translucent */
        #clock-bezel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2vmin;
            height: 2vmin;
            /* Subtle lighter version of the face center — barely-there glass */
            background: radial-gradient(circle at 35% 30%,
                    color-mix(in srgb, white 22%, var(--face-center) 78%),
                    color-mix(in srgb, white 8%, var(--face-center) 92%));
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            transition: background 1s linear;
            box-shadow:
                /* Subtle inner specular — gentle glass edge */
                inset 0.1vmin 0.1vmin 0.3vmin rgba(255, 255, 255, 0.3),
                inset -0.05vmin -0.05vmin 0.2vmin rgba(0, 0, 0, 0.1),
                /* Very soft outer glow — barely visible */
                0 0 0.3vmin rgba(255, 255, 255, 0.2),
                0 0 1.5vmin color-mix(in srgb, var(--current-accent, white) 15%, transparent);
        }
    </style>
</head>

<body>

    <div id="clock-shadow"></div>
    <div id="clock-bezel">
        <div id="clock-face">
            <!-- Viscous Trails -->
            <div id="h-trail-2" class="trail h-trail trail-2"></div>
            <div id="h-trail-1" class="trail h-trail trail-1"></div>
            <div id="m-trail-2" class="trail m-trail trail-2"></div>
            <div id="m-trail-1" class="trail m-trail trail-1"></div>

            <!-- Main Labels -->
            <div id="h-label" class="label hour-label"></div>
            <div id="m-label" class="label minute-label"></div>

            <div class="hand hour"></div>
            <div class="hand minute"></div>
            <div class="hand second"></div>
        </div>
    </div>

    <script>
        // Full 24-hour color palette — from design 3 (restored text colors)
        const timePalettes = [
            { center: '#1e1a4a', edge: '#0c0828', text: '#b0aaff' }, // 0: Midnight — deep indigo
            { center: '#1c1d52', edge: '#0a0930', text: '#aaaeff' }, // 1: Deep Night — blue-indigo
            { center: '#1a2260', edge: '#090f38', text: '#99aaff' }, // 2: Deep Night — sapphire
            { center: '#1e2c72', edge: '#0c1445', text: '#90a8ff' }, // 3: Pre-dawn — cobalt
            { center: '#243680', edge: '#0e1a50', text: '#88aaff' }, // 4: Dawn approaches — royal blue
            { center: '#3a3d90', edge: '#18154a', text: '#c0b8ff' }, // 5: Dawn — violet blue
            { center: '#ffb97b', edge: '#8b3a58', text: '#2a1a1a' }, // 6: Sunrise
            { center: '#f4e2d8', edge: '#e09886', text: '#1a1a1a' }, // 7: Early Morning
            { center: '#d1ebfa', edge: '#85bbd9', text: '#133a4f' }, // 8: Morning
            { center: '#c1e5fc', edge: '#6facd3', text: '#11354a' }, // 9: Mid-Morning
            { center: '#bde2fd', edge: '#58a0d0', text: '#0e2b3c' }, // 10: Late Morning
            { center: '#e4f3ff', edge: '#81bdea', text: '#0f2f42' }, // 11: Noon roughly
            { center: '#ffffff', edge: '#a4cdef', text: '#162e59' }, // 12: Noon
            { center: '#f5fbff', edge: '#8bbfe5', text: '#142a54' }, // 13: Midday
            { center: '#eaf4fc', edge: '#76b1db', text: '#112249' }, // 14: Midday
            { center: '#fcf3e3', edge: '#bba27e', text: '#26223b' }, // 15: Afternoon
            { center: '#ffdfb3', edge: '#d39255', text: '#2f1a3a' }, // 16: Late Afternoon
            { center: '#ffae6b', edge: '#e05929', text: '#420b1c' }, // 17: Golden Hour
            { center: '#ff7e5f', edge: '#8f2336', text: '#fafafa' }, // 18: Sunset
            { center: '#8a4067', edge: '#291b3d', text: '#f0f0f0' }, // 19: Dusk
            { center: '#2e3880', edge: '#121858', text: '#b0c8ff' }, // 20: Blue Hour — deep blue
            { center: '#252a68', edge: '#0e1040', text: '#aab8ff' }, // 21: Night — cobalt
            { center: '#201e58', edge: '#0c0a32', text: '#a8a8ff' }, // 22: Late Night — indigo
            { center: '#1e1c50', edge: '#0a0828', text: '#b0aaff' }  // 23: Night — deep indigo
        ];

        let lastMilestone = -1;
        let lastSecond = -1;
        let rotS = 0;

        let hTargetX = 0, hTargetY = 0;
        let mTargetX = 0, mTargetY = 0;

        const RADIUS = 28.5;

        function getSafeXY(fixedX, fixedY) {
            let angle = Math.random() * Math.PI * 2;
            let x = Math.cos(angle) * RADIUS;
            let y = Math.sin(angle) * RADIUS;
            const dist = Math.sqrt((x - fixedX) ** 2 + (y - fixedY) ** 2);
            if (dist < 23) return getSafeXY(fixedX, fixedY);
            return { x, y };
        }

        function shiftReality() {
            const hAngle = Math.random() * Math.PI * 2;
            const newHTargetX = Math.cos(hAngle) * RADIUS;
            const newHTargetY = Math.sin(hAngle) * RADIUS;

            const mPos = getSafeXY(newHTargetX, newHTargetY);

            const bezel = document.getElementById('clock-bezel');

            if (hTargetX === 0 && hTargetY === 0) {
                hTargetX = newHTargetX;
                hTargetY = newHTargetY;
                mTargetX = mPos.x;
                mTargetY = mPos.y;
                setTimeout(shiftReality, 2000 + Math.random() * 3000);
                return;
            }

            bezel.classList.add('is-h-drifting');

            setTimeout(() => {
                hTargetX = newHTargetX;
                hTargetY = newHTargetY;
            }, 2000);

            setTimeout(() => {
                bezel.classList.remove('is-h-drifting');
            }, 10000);

            const mDelay = 2000 + Math.random() * 2500;
            setTimeout(() => {
                bezel.classList.add('is-m-drifting');

                setTimeout(() => {
                    mTargetX = mPos.x;
                    mTargetY = mPos.y;
                }, 2000);

                setTimeout(() => {
                    bezel.classList.remove('is-m-drifting');
                }, 10000);

            }, mDelay);

            setTimeout(shiftReality, mDelay + 12000 + Math.random() * 8000);
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        // Convert RGB to HSL
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        // Build a glow-only text-shadow (no chromatic offset) so letterforms stay crisp.
        // The solid color is applied directly to element.style.color in the update loop.
        function vibrantGlowShadow(textHex, isHour) {
            const { r, g, b } = hexToRgb(textHex);
            const { h, s } = rgbToHsl(r, g, b);
            const baseHue = s < 8 ? 260 : h;
            const bloomL = isHour ? 85 : 80;

            if (isHour) {
                return [
                    `0 0 8px  hsl(${baseHue.toFixed(0)}, 100%, ${bloomL}%, 0.9)`,
                    `0 0 20px hsl(${baseHue.toFixed(0)}, 100%, 65%, 0.6)`,
                    `0 0 40px hsl(${baseHue.toFixed(0)}, 100%, 55%, 0.3)`
                ].join(', ');
            } else {
                return [
                    `0 0 6px  hsl(${baseHue.toFixed(0)}, 100%, ${bloomL}%, 0.8)`,
                    `0 0 16px hsl(${baseHue.toFixed(0)}, 100%, 60%, 0.5)`,
                    `0 0 32px hsl(${baseHue.toFixed(0)}, 100%, 50%, 0.2)`
                ].join(', ');
            }
        }

        // Compute the vibrant solid color for the label text itself.
        // faceCenterHex is used to determine if the face is light or dark,
        // so we can flip the label lightness for maximum contrast.
        function vibrantLabelColor(textHex, isHour, faceCenterHex) {
            const { r, g, b } = hexToRgb(textHex);
            const { h, s } = rgbToHsl(r, g, b);
            const baseHue = s < 8 ? 260 : h;

            // Check face brightness
            const fc = hexToRgb(faceCenterHex);
            const faceLum = (fc.r * 0.299 + fc.g * 0.587 + fc.b * 0.114) / 255;
            const isLightFace = faceLum > 0.45;

            // On light faces: dark saturated color so numbers pop
            // On dark faces: bright saturated color so they glow
            const l = isLightFace
                ? (isHour ? 28 : 32)
                : (isHour ? 90 : 85);
            return `hsl(${baseHue.toFixed(0)}, 100%, ${l}%)`;
        }

        // Trail shadow — softer bloom, same scheme
        function vibrantTrailShadow(textHex, isHour) {
            const { r, g, b } = hexToRgb(textHex);
            const { h, s } = rgbToHsl(r, g, b);
            const baseHue = s < 8 ? 260 : h;
            const a = isHour ? 0.7 : 0.5;
            return [
                `0 0 6px  hsl(${baseHue.toFixed(0)}, 100%, 80%, ${a})`,
                `0 0 14px hsl(${baseHue.toFixed(0)}, 100%, 65%, ${a * 0.6})`
            ].join(', ');
        }

        // Apply palette-driven colors to all three hands each frame.
        // Hour hand: hue from the palette edge color (deep, rich)
        // Minute hand: ~150° complement so it always contrasts the hour hand
        // Second hand: ~210° further complement (stays in the warm-to-cool spectrum)
        function applyHandColors(edgeHex, centerHex) {
            // Derive hue from face CENTER so complements are always truly different
            const { r: cr, g: cg, b: cb } = hexToRgb(centerHex);
            const { h: cH, s: cS } = rgbToHsl(cr, cg, cb);
            const faceHue = cS < 5 ? 250 : cH;

            // 180° complement for hour, 270° for minute — always visually distinct
            let hourHue = (faceHue + 180) % 360;
            let minuteHue = (faceHue + 270) % 360;

            // Face luminance
            const faceLum = (cr * 0.299 + cg * 0.587 + cb * 0.114) / 255;
            const isLightFace = faceLum > 0.40;

            // NO BROWNS OR MUDDY OLIVES:
            // When putting dark colors on a light sky, hues between 15° and 110° look like brown or dirty green.
            // We forcefully shift them into beautiful rich tones instead (crimson or deep indigo).
            if (isLightFace) {
                if (hourHue >= 10 && hourHue <= 65) hourHue = 340; // Shift orange-brown to Deep Crimson/Plum
                else if (hourHue > 65 && hourHue <= 120) hourHue = 250; // Shift muddy olive to Deep Indigo

                if (minuteHue >= 10 && minuteHue <= 65) minuteHue = 340;
                else if (minuteHue > 65 && minuteHue <= 120) minuteHue = 240;
            }

            // Light faces: very dark saturated hands so the line pops
            // Dark faces: bright neon hands so they glow
            const tipL = isLightFace ? 15 : 85;
            const midL = isLightFace ? 12 : 65;
            const baseL = isLightFace ? 8 : 50;
            const glowA = isLightFace ? 0.8 : 0.9;
            const hourW = isLightFace ? '0.65vmin' : '0.5vmin';
            const minuteW = isLightFace ? '0.5vmin' : '0.35vmin';

            const hourHand = document.querySelector('.hand.hour');
            const minuteHand = document.querySelector('.hand.minute');

            hourHand.style.width = hourW;
            minuteHand.style.width = minuteW;

            // Hour hand gradient + glow
            // base opacity 0.4 means the shaft is never invisible even at the root
            hourHand.style.background = `linear-gradient(to top,
                hsl(${hourHue}, 100%, ${midL}%, 0.4) 0%,
                hsl(${hourHue}, 100%, ${midL}%, 0.8) 40%,
                hsl(${hourHue}, 100%, ${tipL}%, 1) 100%)`;
            hourHand.style.boxShadow = [
                `0 0 0.4vmin hsl(${hourHue}, 100%, ${tipL}%, ${glowA})`,
                `0 0 1.5vmin hsl(${hourHue}, 100%, ${midL}%, ${glowA * 0.55})`,
                `0 0 4vmin   hsl(${hourHue}, 100%, ${baseL}%, ${glowA * 0.25})`
            ].join(', ');

            // Minute hand gradient + glow
            minuteHand.style.background = `linear-gradient(to top,
                hsl(${minuteHue}, 100%, ${midL}%, 0.4) 0%,
                hsl(${minuteHue}, 100%, ${midL}%, 0.8) 40%,
                hsl(${minuteHue}, 100%, ${tipL}%, 1) 100%)`;
            minuteHand.style.boxShadow = [
                `0 0 0.4vmin hsl(${minuteHue}, 100%, ${tipL}%, ${glowA})`,
                `0 0 1.5vmin hsl(${minuteHue}, 100%, ${midL}%, ${glowA * 0.55})`,
                `0 0 4vmin   hsl(${minuteHue}, 100%, ${baseL}%, ${glowA * 0.2})`
            ].join(', ');
            // Second hand stays constant vibrant red

        }


        function update() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            let effectiveH = h;
            let effectiveM = m - 3;
            if (effectiveM < 0) {
                effectiveM += 60;
                effectiveH -= 1;
            }
            if (effectiveH < 0) {
                effectiveH += 24;
            }

            const displayH = effectiveH % 12 || 12;
            const mMilestone = Math.floor(effectiveM / 5) * 5;

            const hLabelEl = document.getElementById('h-label');
            const mLabelEl = document.getElementById('m-label');

            const trailsH = document.querySelectorAll('.h-trail');
            const trailsM = document.querySelectorAll('.m-trail');

            hLabelEl.textContent = displayH;
            trailsH.forEach(t => t.textContent = displayH);

            if (mMilestone !== lastMilestone) {
                lastMilestone = mMilestone;

                let displayM = String(lastMilestone);
                if (lastMilestone === 5) {
                    displayM = '05';
                } else if (lastMilestone === 0) {
                    displayM = '0';
                }

                mLabelEl.textContent = displayM;
                trailsM.forEach(t => t.textContent = displayM);
            }

            const finalBaseHAngle = Math.atan2(hTargetY, hTargetX) * 180 / Math.PI + 90;
            const finalBaseMAngle = Math.atan2(mTargetY, mTargetX) * 180 / Math.PI + 90;

            const hOffset = (m / 60) * 30 + (s / 3600) * 30;
            const mOffset = (m - lastMilestone) * 6 + (s / 60) * 6;

            let targetH = finalBaseHAngle + hOffset;
            let targetM = finalBaseMAngle + mOffset;

            // ─── Color-shifting logic — design 3 system ───
            const DEMO_CYCLE_MS = 120 * 1000;
            const demoMs = (Date.now() % DEMO_CYCLE_MS);
            const demoHourFrac = (demoMs / DEMO_CYCLE_MS) * 24;
            const demoH = Math.floor(demoHourFrac);
            const demoProgress = demoHourFrac - demoH;
            const cp = timePalettes[demoH % 24];
            const np = timePalettes[(demoH + 1) % 24];

            document.documentElement.style.setProperty('--face-center',
                `color-mix(in srgb, ${np.center} ${demoProgress * 100}%, ${cp.center})`);
            document.documentElement.style.setProperty('--face-edge',
                `color-mix(in srgb, ${np.edge} ${demoProgress * 100}%, ${cp.edge})`);

            // Output the current and next accent colors to the CSS root
            document.documentElement.style.setProperty('--current-accent', cp.text);
            document.documentElement.style.setProperty('--next-accent', np.text);
            document.documentElement.style.setProperty('--next-face', np.center);

            // ─── Vibrant label glows from palette text colors ───
            // Interpolate the text color across the current palette step
            // (We don't need a CSS color-mix here — just pick the dominant slot)
            const textHex = cp.text;
            const hColor = vibrantLabelColor(textHex, true, cp.center);
            const mColor = vibrantLabelColor(textHex, false, cp.center);
            const hGlow = vibrantGlowShadow(textHex, true);
            const mGlow = vibrantGlowShadow(textHex, false);
            const trailShadow = vibrantTrailShadow(textHex, true);
            const mTrailShadow = vibrantTrailShadow(textHex, false);

            // Solid color = crisp letterforms; text-shadow = glow bloom on top
            const hLabel = document.getElementById('h-label');
            const mLabel = document.getElementById('m-label');
            hLabel.style.color = hColor;
            hLabel.style.textShadow = hGlow;
            mLabel.style.color = mColor;
            mLabel.style.textShadow = mGlow;
            document.querySelectorAll('.h-trail').forEach(el => { el.style.color = hColor; el.style.textShadow = trailShadow; });
            document.querySelectorAll('.m-trail').forEach(el => { el.style.color = mColor; el.style.textShadow = mTrailShadow; });

            // Dynamic hand colors — hour + minute only, second stays red
            applyHandColors(cp.edge, cp.center);

            if (window.rotH === undefined) {
                window.rotH = targetH;
                window.rotM = targetM;
                window.rotHT1 = targetH;
                window.rotHT2 = targetH;
                window.rotMT1 = targetM;
                window.rotMT2 = targetM;
            }

            function sweep(current, target, speed) {
                let diff = (target - current) % 360;
                if (diff < 0) diff += 360;
                if (diff > 359.5) diff = 0;
                return current + diff * speed;
            }

            window.rotH = sweep(window.rotH, targetH, 0.01);
            window.rotM = sweep(window.rotM, targetM, 0.01);

            window.rotHT1 = sweep(window.rotHT1, targetH, 0.0094);
            window.rotHT2 = sweep(window.rotHT2, targetH, 0.009);

            window.rotMT1 = sweep(window.rotMT1, targetM, 0.0094);
            window.rotMT2 = sweep(window.rotMT2, targetM, 0.009);

            document.querySelector('.hand.hour').style.transform = `translateX(-50%) rotate(${window.rotH}deg)`;
            document.querySelector('.hand.minute').style.transform = `translateX(-50%) rotate(${window.rotM}deg)`;

            function updateLabel(id, rot, offset) {
                const rad = (rot - offset - 90) * Math.PI / 180;
                const x = Math.cos(rad) * RADIUS;
                const y = Math.sin(rad) * RADIUS;
                document.getElementById(id).style.transform = `translate3d(calc(-50% + ${x}vmin), calc(-50% + ${y}vmin), 0)`;
            }

            updateLabel('h-label', window.rotH, hOffset);
            updateLabel('h-trail-1', window.rotHT1, hOffset);
            updateLabel('h-trail-2', window.rotHT2, hOffset);

            updateLabel('m-label', window.rotM, mOffset);
            updateLabel('m-trail-1', window.rotMT1, mOffset);
            updateLabel('m-trail-2', window.rotMT2, mOffset);

            if (s !== lastSecond) {
                const diff = (s - lastSecond + 60) % 60;
                rotS += diff * 6;
                lastSecond = s;
                document.querySelector('.hand.second').style.transform = `translateX(-50%) rotate(${rotS}deg)`;
            }

            requestAnimationFrame(update);
        }

        shiftReality();
        update();
    </script>
</body>

</html>
