<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Orientation — Premium Reality</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #ff3b30;
            --clock-size: 75vmin;
            --label-size: 8vmin;
            --reality-ease: cubic-bezier(0.16, 1, 0.3, 1);

            /* Dynamic Time Colors */
            --face-center: #1a1a24;
            --face-edge: #050508;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Bright clean background */
            background: #fcfcfc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Premium Lighter Milled Metal Bezel */
        #clock-bezel {
            width: var(--clock-size);
            height: var(--clock-size);
            border: 0.2vmin solid #b5b5b5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            background: linear-gradient(135deg, #d8d8d8 0%, #f4f4f4 50%, #b0b0b0 100%);
            padding: 1.2vmin;
            box-shadow:
                inset 0.3vmin 0.3vmin 0.8vmin rgba(255, 255, 255, 1),
                inset -0.4vmin -0.4vmin 1.5vmin rgba(0, 0, 0, 0.15),
                inset 1vmin 1vmin 3vmin rgba(255, 255, 255, 0.4);
            transform: translateZ(0);
        }

        /* Transparent Glass Dial */
        #clock-face {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            /* Dynamically driven by JS time progression */
            background: radial-gradient(circle at 30% 30%, var(--face-center) 0%, var(--face-edge) 100%);
            box-shadow:
                inset 0 0 4vmin rgba(255, 255, 255, 0.1),
                inset 2vmin 2vmin 5vmin rgba(0, 0, 0, 0.4);
            transition: background 1s linear;
            /* Smooth micro-transitions */
        }

        /* Viscous Trail Elements */
        .trail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            width: 20vmin;
            height: 10vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 3s ease;
            filter: blur(1px);
        }

        /* Only show trails during the active drift */
        .is-h-drifting .h-trail,
        .is-m-drifting .m-trail {
            opacity: 0.15;
            transition: opacity 0.5s ease;
        }

        /* Ensure trial font matches labels */
        .h-trail {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
        }

        .m-trail {
            font-weight: 200;
        }

        /* Labels (Modernized Typography) */
        .label {
            position: absolute;
            top: 50%;
            left: 50%;
            transition: opacity 3s ease, filter 3s ease;
            font-size: var(--label-size);
            color: var(--text-color);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 20vmin;
            height: 12vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
            transform: translate(-50%, -50%);
        }

        .hour-label {
            font-weight: 500;
            font-size: calc(var(--label-size) * 1.15);
            /* Drop shadow to float above the mesh */
            filter: drop-shadow(0 1vmin 1.5vmin rgba(0, 0, 0, 0.25));
            z-index: 12;
        }

        .minute-label {
            font-weight: 200;
            opacity: 0.8;
            /* Recess it slightly */
            filter: drop-shadow(0 0.5vmin 1vmin rgba(0, 0, 0, 0.15));
            z-index: 11;
        }

        /* Ghosting Effect during Drift */
        .is-h-drifting .hour-label,
        .is-m-drifting .minute-label {
            opacity: 0.03;
            filter: blur(4px);
            transition: opacity 2s ease, filter 2s ease;
        }

        /* Apply ghosting to hands */
        .is-h-drifting .hand.hour,
        .is-m-drifting .hand.minute {
            opacity: 0.03;
            filter: blur(3px);
            transition: opacity 2s ease, filter 2s ease;
        }

        /* Premium Solid Hands */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            border-radius: 10vmin;
            z-index: 100;
            transition: opacity 3s ease, filter 3s ease;
            box-shadow:
                0 1vmin 2vmin rgba(0, 0, 0, 0.2),
                inset 0 0 0.5vmin rgba(255, 255, 255, 0.8);
        }

        .hand.hour {
            width: 1.1vmin;
            height: 21vmin;
            background: var(--text-color);
            z-index: 101;
            box-shadow: 0 0.5vmin 1vmin rgba(0, 0, 0, 0.5);
        }

        .hand.minute {
            width: 0.8vmin;
            height: 34vmin;
            background: var(--text-color);
            opacity: 0.8;
            z-index: 100;
            box-shadow: 0 0.5vmin 1vmin rgba(0, 0, 0, 0.3);
        }

        .hand.second {
            width: 0.4vmin;
            height: 34vmin;
            background: var(--accent-color);
            z-index: 150;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            box-shadow:
                0 0 1vmin var(--accent-color),
                0 0 2vmin var(--accent-color);
        }

        /* Multi-tier Engineering Center Pin */
        #clock-bezel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.6vmin;
            height: 2.6vmin;
            background: linear-gradient(145deg, #ffffff, #d9d9d9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1999;
            box-shadow:
                -0.5vmin 0.5vmin 1vmin rgba(0, 0, 0, 0.15),
                inset 0.2vmin 0.2vmin 0.5vmin rgba(255, 255, 255, 0.8);
        }

        #clock-bezel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.8vmin;
            height: 0.8vmin;
            background: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2001;
            box-shadow:
                0 0 0.8vmin var(--accent-color);
        }
    </style>
</head>

<body>

    <div id="clock-bezel">
        <div id="clock-face">
            <!-- Viscous Trails -->
            <div id="h-trail-2" class="trail h-trail trail-2"></div>
            <div id="h-trail-1" class="trail h-trail trail-1"></div>
            <div id="m-trail-2" class="trail m-trail trail-2"></div>
            <div id="m-trail-1" class="trail m-trail trail-1"></div>

            <!-- Main Labels -->
            <div id="h-label" class="label hour-label"></div>
            <div id="m-label" class="label minute-label"></div>

            <div class="hand hour"></div>
            <div class="hand minute"></div>
            <div class="hand second"></div>
        </div>
    </div>

    <script>
        // Define the 24-hour color gradient progression for the clock dial
        const timePalettes = [
            { center: '#1a1a24', edge: '#050508', text: '#e0e0e0' }, // 0: Midnight
            { center: '#1a1c29', edge: '#060811', text: '#e0e0e0' }, // 1: Deep Night
            { center: '#1b2236', edge: '#080d1c', text: '#e0e0e0' }, // 2: Deep Night
            { center: '#222b42', edge: '#0b1325', text: '#e0e0e0' }, // 3: Very early
            { center: '#2d3b5e', edge: '#111b33', text: '#e0e0e0' }, // 4: Dawn approaches
            { center: '#4c4e7a', edge: '#1c1b3b', text: '#eaeaea' }, // 5: Dawn
            { center: '#ffb97b', edge: '#8b3a58', text: '#2a1a1a' }, // 6: Sunrise
            { center: '#f4e2d8', edge: '#e09886', text: '#1a1a1a' }, // 7: Early Morning 
            { center: '#d1ebfa', edge: '#85bbd9', text: '#133a4f' }, // 8: Morning
            { center: '#c1e5fc', edge: '#6facd3', text: '#11354a' }, // 9: Mid-Morning
            { center: '#bde2fd', edge: '#58a0d0', text: '#0e2b3c' }, // 10: Late Morning
            { center: '#e4f3ff', edge: '#81bdea', text: '#0f2f42' }, // 11: Noon roughly
            { center: '#ffffff', edge: '#a4cdef', text: '#163f59' }, // 12: Noon
            { center: '#f5fbff', edge: '#8bbfe5', text: '#143b54' }, // 13: Midday
            { center: '#eaf4fc', edge: '#76b1db', text: '#113349' }, // 14: Midday
            { center: '#fcf3e3', edge: '#bba27e', text: '#3c2c19' }, // 15: Afternoon
            { center: '#ffdfb3', edge: '#d39255', text: '#4a2d14' }, // 16: Late Afternoon
            { center: '#ffae6b', edge: '#e05929', text: '#4d1e0d' }, // 17: Golden Hour
            { center: '#ff7e5f', edge: '#8f2336', text: '#fafafa' }, // 18: Sunset 
            { center: '#8a4067', edge: '#291b3d', text: '#f0f0f0' }, // 19: Dusk
            { center: '#413c6b', edge: '#16142e', text: '#d0d0d0' }, // 20: Blue Hour
            { center: '#2b2c4e', edge: '#0e0e1a', text: '#d0d0d0' }, // 21: Night
            { center: '#202138', edge: '#090912', text: '#e0e0e0' }, // 22: Late Night
            { center: '#1a1b2b', edge: '#06060c', text: '#e0e0e0' }  // 23: Night
        ];

        let lastMilestone = -1;
        let lastSecond = -1;
        let rotS = 0;

        let hTargetX = 0, hTargetY = 0;
        let mTargetX = 0, mTargetY = 0;

        const RADIUS = 28.5; // Adjusted to a middle ground for better spacing

        function getSafeXY(fixedX, fixedY) {
            let angle = Math.random() * Math.PI * 2;
            let x = Math.cos(angle) * RADIUS;
            let y = Math.sin(angle) * RADIUS;
            const dist = Math.sqrt((x - fixedX) ** 2 + (y - fixedY) ** 2);
            if (dist < 23) return getSafeXY(fixedX, fixedY);
            return { x, y };
        }

        function shiftReality() {
            const hAngle = Math.random() * Math.PI * 2;
            const newHTargetX = Math.cos(hAngle) * RADIUS;
            const newHTargetY = Math.sin(hAngle) * RADIUS;

            const mPos = getSafeXY(newHTargetX, newHTargetY);

            const bezel = document.getElementById('clock-bezel');

            // Initialize position immediately on first load without fading
            if (hTargetX === 0 && hTargetY === 0) {
                hTargetX = newHTargetX;
                hTargetY = newHTargetY;
                mTargetX = mPos.x;
                mTargetY = mPos.y;
                setTimeout(shiftReality, 2000 + Math.random() * 3000);
                return;
            }

            // 1. Shift Hour
            bezel.classList.add('is-h-drifting');

            setTimeout(() => {
                hTargetX = newHTargetX;
                hTargetY = newHTargetY;
            }, 2000);

            setTimeout(() => {
                bezel.classList.remove('is-h-drifting');
            }, 10000);

            // 2. Shift Minute after a detached, random delay (1.5 to 4 seconds later)
            const mDelay = 2000 + Math.random() * 2500;
            setTimeout(() => {
                bezel.classList.add('is-m-drifting');

                setTimeout(() => {
                    mTargetX = mPos.x;
                    mTargetY = mPos.y;
                }, 2000);

                setTimeout(() => {
                    bezel.classList.remove('is-m-drifting');
                }, 10000);

            }, mDelay);

            // Reschedule next shift cycle (wait for both to finish + resting time)
            setTimeout(shiftReality, mDelay + 12000 + Math.random() * 8000);
        }

        function update() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            const displayH = h % 12 || 12;

            // Ensure the minute reference is always at least 3 minutes behind the hand
            let effectiveM = m - 3;
            if (effectiveM < 0) effectiveM += 60; // Wraparound securely
            const mMilestone = Math.floor(effectiveM / 5) * 5;

            const hLabelEl = document.getElementById('h-label');
            const mLabelEl = document.getElementById('m-label');

            // Sync trail text with main labels
            const trailsH = document.querySelectorAll('.h-trail');
            const trailsM = document.querySelectorAll('.m-trail');

            hLabelEl.textContent = displayH;
            trailsH.forEach(t => t.textContent = displayH);

            if (mMilestone !== lastMilestone) {
                lastMilestone = mMilestone;

                // Only 5 gets a prefixed zero '05'. 0 is just '0'.
                let displayM = String(lastMilestone);
                if (lastMilestone === 5) {
                    displayM = '05';
                } else if (lastMilestone === 0) {
                    displayM = '0';
                }

                mLabelEl.textContent = displayM;
                trailsM.forEach(t => t.textContent = displayM);
            }

            // Use target coordinates directly to calculate the true final angle the hands are seeking
            const finalBaseHAngle = Math.atan2(hTargetY, hTargetX) * 180 / Math.PI + 90;
            const finalBaseMAngle = Math.atan2(mTargetY, mTargetX) * 180 / Math.PI + 90;

            const hOffset = (m / 60) * 30 + (s / 3600) * 30;
            const mOffset = (m - lastMilestone) * 6 + (s / 60) * 6;

            let targetH = finalBaseHAngle + hOffset;
            let targetM = finalBaseMAngle + mOffset;

            // Interpolate dynamic daylight colors!
            // We use the exact fractional progress of the current hour to blend smoothly into the next hour's target color
            const ms = now.getMilliseconds();
            const progress = (m * 60 * 1000 + s * 1000 + ms) / (60 * 60 * 1000);
            const cp = timePalettes[h];
            const np = timePalettes[(h + 1) % 24];

            document.documentElement.style.setProperty('--face-center', `color-mix(in srgb, ${np.center} ${progress * 100}%, ${cp.center})`);
            document.documentElement.style.setProperty('--face-edge', `color-mix(in srgb, ${np.edge} ${progress * 100}%, ${cp.edge})`);
            document.documentElement.style.setProperty('--text-color', `color-mix(in srgb, ${np.text} ${progress * 100}%, ${cp.text})`);

            // Initialize global hand rotations if they don't exist
            if (window.rotH === undefined) {
                window.rotH = targetH;
                window.rotM = targetM;
                window.rotHT1 = targetH;
                window.rotHT2 = targetH;
                window.rotMT1 = targetM;
                window.rotMT2 = targetM;
            }

            function sweep(current, target, speed) {
                let diff = (target - current) % 360;
                if (diff < 0) diff += 360;
                if (diff > 359.5) diff = 0;
                return current + diff * speed;
            }

            window.rotH = sweep(window.rotH, targetH, 0.01);
            window.rotM = sweep(window.rotM, targetM, 0.01);

            window.rotHT1 = sweep(window.rotHT1, targetH, 0.0094);
            window.rotHT2 = sweep(window.rotHT2, targetH, 0.009);

            window.rotMT1 = sweep(window.rotMT1, targetM, 0.0094);
            window.rotMT2 = sweep(window.rotMT2, targetM, 0.009);

            document.querySelector('.hand.hour').style.transform = `translateX(-50%) rotate(${window.rotH}deg)`;
            document.querySelector('.hand.minute').style.transform = `translateX(-50%) rotate(${window.rotM}deg)`;

            function updateLabel(id, rot, offset) {
                const rad = (rot - offset - 90) * Math.PI / 180;
                const x = Math.cos(rad) * RADIUS;
                const y = Math.sin(rad) * RADIUS;
                document.getElementById(id).style.transform = `translate3d(calc(-50% + ${x}vmin), calc(-50% + ${y}vmin), 0)`;
            }

            updateLabel('h-label', window.rotH, hOffset);
            updateLabel('h-trail-1', window.rotHT1, hOffset);
            updateLabel('h-trail-2', window.rotHT2, hOffset);

            updateLabel('m-label', window.rotM, mOffset);
            updateLabel('m-trail-1', window.rotMT1, mOffset);
            updateLabel('m-trail-2', window.rotMT2, mOffset);

            if (s !== lastSecond) {
                const diff = (s - lastSecond + 60) % 60;
                rotS += diff * 6;
                lastSecond = s;
                document.querySelector('.hand.second').style.transform = `translateX(-50%) rotate(${rotS}deg)`;
            }

            requestAnimationFrame(update);
        }

        shiftReality();
        update();
    </script>
</body>

</html>
